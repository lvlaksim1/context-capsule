name: One-time v1.3.1 release

on:
  push:
    paths:
      - ".github/workflows/release-v1.3.1.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create canonical v1.3.1 release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: v1.3.1
          TARGET: 2ef41a5ed57ae514cc5980065560d7e55d5e4b9a
        run: |
          set -euo pipefail
          if gh api "repos/$REPO/releases/tags/$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it unchanged."
            exit 0
          fi

          cat > /tmp/release-notes.md <<'EOF'
          ## Context Capsule Core v1.3.1

          Provenance-hardening patch for the stable v1.3 line.

          - establishes one canonical immutable Core source for v1.3.1;
          - resolves the v1.3.0 provenance ambiguity;
          - requires installed capsules to record the exact Core commit in `.context/capsule.json`;
          - aligns the known installed consumers to the same canonical Core commit;
          - preserves project-owned semantic context while updating only Core-managed surfaces and provenance metadata.

          Canonical Core commit:

          `2ef41a5ed57ae514cc5980065560d7e55d5e4b9a`

          This is a stable release, not a prerelease. No additional release assets are required beyond GitHub's standard source archives.
          EOF

          gh api --method POST "repos/$REPO/releases" \
            -f tag_name="$TAG" \
            -f target_commitish="$TARGET" \
            -f name="Context Capsule Core v1.3.1" \
            -F draft=false \
            -F prerelease=false \
            --raw-field body="$(cat /tmp/release-notes.md)"
