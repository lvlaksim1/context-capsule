name: Context Capsule CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run v1.3 hardening tests
        run: python -m unittest discover -s tests -v
      - name: Compile lifecycle modules
        run: python -m compileall -q installer
      - name: Self validate
        run: python installer/capsulectl.py validate --target .
      - name: Self recovery readiness
        run: python installer/capsulectl.py ready --target .
      - name: Fresh-chat recovery smoke test
        run: |
          python installer/capsulectl.py recover --target . --max-chars 30000 > /tmp/context-recovery.txt
          test -s /tmp/context-recovery.txt
