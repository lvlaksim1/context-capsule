name: Context Capsule CI

on:
  push:
    branches:
      - main
      - v2-manager-runtime
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run permanent tests
        run: python -m unittest discover -s tests -v
      - name: Compile lifecycle modules
        run: python -m compileall -q installer
      - name: Self validate
        run: python installer/capsulectl.py validate --target .
      - name: Self Project Manager readiness
        run: |
          EXTRA=()
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            EXTRA+=(--non-authoritative)
          fi
          python installer/capsulectl.py ready --target . "${EXTRA[@]}"
      - name: Project Manager reinstantiation smoke test
        run: |
          EXTRA=()
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            EXTRA+=(--non-authoritative)
          fi
          python installer/capsulectl.py recover --target . --max-chars 50000 "${EXTRA[@]}" > /tmp/context-recovery.txt
          test -s /tmp/context-recovery.txt
          grep -q "Manager ID: context-capsule-project-manager" /tmp/context-recovery.txt
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            grep -q "NON-AUTHORITATIVE MAINTENANCE/AUDIT PACK" /tmp/context-recovery.txt
            grep -q "Do not instantiate, resume, or continue the Project Manager" /tmp/context-recovery.txt
          else
            grep -q "new runtime instance of the existing Project Manager" /tmp/context-recovery.txt
          fi
          grep -q "## MANAGER CONTRACT" /tmp/context-recovery.txt

      - name: Isolated consumer compatibility smoke
        if: github.ref == 'refs/heads/v2-manager-runtime'
        run: |
          git clone --depth 1 https://github.com/lvlaksim1/evrasia-hd-testbed.git /tmp/evrasia-hd-testbed
          python installer/capsulectl.py repair             --target /tmp/evrasia-hd-testbed             --repository lvlaksim1/evrasia-hd-testbed             --branch main             --core-commit "$GITHUB_SHA"
          python installer/capsulectl.py validate --target /tmp/evrasia-hd-testbed
          if python installer/capsulectl.py ready --target /tmp/evrasia-hd-testbed > /tmp/legacy-ready.txt 2>&1; then
            echo "Expected legacy unprovenanced procedural memory to block READY"
            exit 1
          fi
          grep -q "memory.procedural entry" /tmp/legacy-ready.txt
          python - <<'PY'
          from pathlib import Path
          path = Path("/tmp/evrasia-hd-testbed/.context/memory/procedural.md")
          lines = []
          for line in path.read_text(encoding="utf-8").splitlines():
              if line.startswith("- ") and "source:" not in line.lower():
                  line += " source: existing project procedural memory; authority: project-owned-memory."
              lines.append(line)
          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          python installer/capsulectl.py ready --target /tmp/evrasia-hd-testbed
          python installer/capsulectl.py recover --target /tmp/evrasia-hd-testbed --max-chars 50000 > /tmp/consumer-recovery.txt
          test -s /tmp/consumer-recovery.txt
          grep -q "Manager ID: evrasia-hd-project-manager" /tmp/consumer-recovery.txt
          grep -q "## MANAGER CONTRACT" /tmp/consumer-recovery.txt
      - name: Service Agent CLI smoke
        if: github.ref == 'refs/heads/v2-manager-runtime'
        run: |
          rm -rf /tmp/service-agent-smoke
          git init -b main /tmp/service-agent-smoke
          python installer/capsulectl.py service-install             --target /tmp/service-agent-smoke             --repository lvlaksim1/service-agent-smoke             --branch main             --agent-id service-agent-smoke             --role "Service Agent"             --specialization "CI compatibility smoke"             --core-commit "$GITHUB_SHA"
          python - <<'PY'
          from pathlib import Path
          root = Path("/tmp/service-agent-smoke")
          values = {
              ".context/service-agent/mandate.md": "# Mandate\n\nProvide bounded CI analysis only; target action requires an explicit engagement grant.\n",
              ".context/service-agent/capabilities.md": "# Capabilities\n\nInspect supplied repository state and produce verified structured service results.\n",
              ".context/service-agent/limitations.md": "# Limitations\n\nDoes not own target repositories and does not infer target authority from tool access.\n",
              ".context/service-agent/principal-model.md": "# Principal model\n\nThe owner or an explicitly authorized coordinating agent may invoke the service.\n",
              ".context/service-agent/invocation-contract.md": "# Invocation contract\n\nRequire request ID, requester, objective, target, scope, authority grant, constraints, data boundary, and deliverable.\n",
              ".context/service-agent/result-contract.md": "# Result contract\n\nReturn evidence, findings, uncertainties, actions actually performed, recommendations, and escalation status.\n",
              ".context/service-agent/beliefs.md": "# Beliefs\n\n- Targets remain external engagements. source: Service Agent Contract; authority: core-contract.\n",
              ".context/service-agent/goals.md": "# Goals\n\nPreserve durable service identity while providing bounded professional assistance.\n",
              ".context/service-agent/intentions.md": "# Intentions\n\n- Preserve target isolation and complete accepted engagements within explicit authority.\n",
              ".context/service-agent/plans.md": "# Plans\n\nValidate invocation, acquire scoped context, verify result, and persist only professional lessons.\n",
              ".context/service-agent/engagements.md": "# Active engagements\n\nThere are no active engagements; this empty state is explicitly verified.\n",
              ".context/current/state.md": "# State\n\nThe CI Service Agent profile is installed and ready for deterministic recovery.\n",
              ".context/current/blockers.md": "# Blockers\n\nNo current blockers are verified.\n",
              ".context/current/next.md": "# Next\n\nWait for a valid service invocation.\n",
              ".context/memory/semantic.md": "# Semantic memory\n\nService capability does not imply target authority. source: Service Agent Contract; authority: core-contract.\n",
              ".context/memory/procedural.md": "# Procedural memory\n\nValidate requester, target, scope, authority, constraints, and deliverable before action.\n",
              ".context/handoffs/latest.md": "# Handoff\n\nNo active handoff; continuity is held by service identity and state.\n",
          }
          for rel, text in values.items():
              path = root / rel
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(text, encoding="utf-8")
          PY
          python installer/capsulectl.py service-validate --target /tmp/service-agent-smoke
          python installer/capsulectl.py service-ready --target /tmp/service-agent-smoke
          python installer/capsulectl.py service-recover --target /tmp/service-agent-smoke --max-chars 50000 > /tmp/service-agent-recovery.txt
          grep -q "Agent ID: service-agent-smoke" /tmp/service-agent-recovery.txt
          grep -q "SERVICE AGENT CONTRACT" /tmp/service-agent-recovery.txt
          python installer/capsulectl.py service-repair             --target /tmp/service-agent-smoke             --repository lvlaksim1/service-agent-smoke             --branch main             --core-commit "$GITHUB_SHA"
          python installer/capsulectl.py service-ready --target /tmp/service-agent-smoke
