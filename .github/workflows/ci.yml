name: Context Capsule CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Self-validate central capsule
        run: python installer/capsulectl.py validate --target .
      - name: Self-audit central capsule
        run: python installer/capsulectl.py audit --target .
