name: Apply v2 Manager Runtime overlay

on:
  push:
    branches:
      - v2-manager-runtime
    paths:
      - ".github/workflows/apply-v2-manager-runtime.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2-manager-runtime
          fetch-depth: 0
      - name: Verify trigger head
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Apply tested v2 snapshot atomically
        env:
          OVERLAY_B64: "[...snip...]"
        run: |
          set -euo pipefail
          printf '%s' "$OVERLAY_B64" | base64 -d > /tmp/v2-overlay.tar.gz
          echo "0fe4190e060794390e156c398ad1aedb3be07531534e0562a175dc4fb01c6d03  /tmp/v2-overlay.tar.gz" | sha256sum -c -
          tar -xzf /tmp/v2-overlay.tar.gz -C .
          rm .github/workflows/apply-v2-manager-runtime.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Implement Context Capsule v2 Project Manager model"
          git push origin HEAD:v2-manager-runtime
